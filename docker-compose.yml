# Single-container deployment for Org-Chart Builder.
#
#   docker compose up -d
#   open http://localhost:8080
#
# Charts are persisted to ./data on the host (mounted at /app/data inside
# the container). Override the host path via the ORG_CHART_DATA env var
# or by editing the volume line directly. See README → "Storage & volume
# mount" for bind-mounts vs. named volumes vs. UID/GID workarounds.

services:
  org-chart:
    image: ghcr.io/xozy22/org-chart:latest
    build: .
    container_name: org-chart
    restart: unless-stopped
    ports:
      - "8080:3000"
    volumes:
      - ${ORG_CHART_DATA:-./data}:/app/data
    environment:
      - PORT=3000
      - CORS_ORIGIN=*
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
