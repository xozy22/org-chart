server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ── Compression ────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml+rss
    image/svg+xml;

  # ── Long-cache hashed assets (Vite emits hashed filenames) ─
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # ── Misc static assets ────────────────────────────────────
  location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|ico)$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # ── SPA fallback ──────────────────────────────────────────
  # Everything else falls back to index.html so client-side routes work.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Hide nginx version in headers
  server_tokens off;
}
