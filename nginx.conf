server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ── Compression ────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml+rss
    image/svg+xml;

  # ── Reverse-proxy /api to the backend container ───────────
  # The backend is reachable as `org-chart-backend` on the docker network
  # (set up via docker-compose). When this image runs without a backend,
  # /api/ requests will fail with 502 — the frontend gracefully falls
  # back to localStorage-only mode in that case.
  location /api/ {
    proxy_pass http://org-chart-backend:3000/api/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Surface the ETag and X-New-Default custom headers to the browser.
    proxy_pass_header ETag;
    proxy_pass_header X-New-Default;
    # Larger body limit for chart payloads (matches express limit).
    client_max_body_size 10m;
    proxy_read_timeout 30s;
  }

  # ── Long-cache hashed assets (Vite emits hashed filenames) ─
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # ── Misc static assets ────────────────────────────────────
  location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|ico)$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # ── SPA fallback ──────────────────────────────────────────
  # Everything else falls back to index.html so client-side routes work.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Hide nginx version in headers
  server_tokens off;
}
