<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Org-Chart Builder</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <!-- Brand mark — logo + wordmark, leftmost -->
      <div class="toolbar-brand" aria-label="Org-Chart Builder">
        <img src="/logo.svg" alt="" class="toolbar-brand-logo" />
        <span class="toolbar-brand-text">ORG·CHART</span>
      </div>

      <!-- Group 1: Workspace switcher (chart navigation) -->
      <div class="toolbar-group">
        <button id="btn-workspaces" class="btn btn-chart-name" title="Charts verwalten" aria-label="Charts verwalten" hidden>🗂 Charts</button>
      </div>

      <!-- Group 2: Undo / redo (always-visible primary editing controls) -->
      <div class="toolbar-group">
        <button id="btn-undo" class="btn btn-icon" title="Rückgängig (Strg+Z)" aria-label="Rückgängig" disabled>↶</button>
        <button id="btn-redo" class="btn btn-icon" title="Wiederholen (Strg+Y / Strg+Shift+Z)" aria-label="Wiederholen" disabled>↷</button>
      </div>

      <!-- Group 3: Search (centre, flex) -->
      <div class="toolbar-group toolbar-search">
        <input id="search-input" type="search" placeholder="🔍 Suche nach Name, Titel, Abteilung…" />
      </div>

      <!-- Group 4: Actions menu (everything else) -->
      <div class="toolbar-group">
        <div class="menu" data-menu="actions">
          <button id="btn-actions" class="btn menu-trigger" aria-haspopup="true" aria-expanded="false" type="button">
            Aktionen <span class="menu-caret">▾</span>
          </button>
          <div class="menu-popup" role="menu" hidden>
            <button class="menu-item menu-item-primary" data-menu-action="add-root" role="menuitem">
              <span class="menu-icon">+</span><span class="menu-label">Neuer Wurzelknoten</span>
            </button>
            <hr class="menu-sep">
            <button class="menu-item" data-menu-action="layout-mode" role="menuitem">
              <span class="menu-icon">🔀</span><span class="menu-label">Layout: <span id="menu-layout-label">Auto</span></span>
            </button>
            <button class="menu-item" data-menu-action="expand-all" role="menuitem">
              <span class="menu-icon">⊞</span><span class="menu-label">Alle aufklappen</span>
            </button>
            <button class="menu-item" data-menu-action="collapse-all" role="menuitem">
              <span class="menu-icon">⊟</span><span class="menu-label">Alle einklappen</span>
            </button>
            <hr class="menu-sep">
            <button class="menu-item" data-menu-action="settings" role="menuitem">
              <span class="menu-icon">⚙</span><span class="menu-label">Eigene Felder…</span>
            </button>
            <button class="menu-item" data-menu-action="stats" role="menuitem">
              <span class="menu-icon">📊</span><span class="menu-label">Statistiken</span>
            </button>
            <hr class="menu-sep">
            <span class="menu-section-label">Markierte Knoten</span>
            <button class="menu-item" data-menu-action="copy-selected-text" role="menuitem">
              <span class="menu-icon">📋</span><span class="menu-label">Als Text kopieren</span>
            </button>
            <button class="menu-item" data-menu-action="copy-selected-vcard" role="menuitem">
              <span class="menu-icon">📇</span><span class="menu-label">Als vCard(s) herunterladen</span>
            </button>
          </div>
        </div>

        <!-- Group 5: File menu (import/export) -->
        <div class="menu" data-menu="file">
          <button id="btn-file" class="btn menu-trigger" aria-haspopup="true" aria-expanded="false" type="button">
            Datei <span class="menu-caret">▾</span>
          </button>
          <div class="menu-popup" role="menu" hidden>
            <span class="menu-section-label">Import</span>
            <button class="menu-item" data-menu-action="import-json" role="menuitem">
              <span class="menu-icon">⬆</span><span class="menu-label">JSON-Datei…</span>
            </button>
            <button class="menu-item" data-menu-action="import-csv" role="menuitem">
              <span class="menu-icon">⬆</span><span class="menu-label">CSV-Datei…</span>
            </button>
            <hr class="menu-sep">
            <span class="menu-section-label">Export</span>
            <button class="menu-item" data-menu-action="export-json" role="menuitem">
              <span class="menu-icon">⬇</span><span class="menu-label">JSON-Datei</span>
            </button>
            <button class="menu-item" data-menu-action="export-png" role="menuitem">
              <span class="menu-icon">🖼</span><span class="menu-label">PNG (Bild)</span>
            </button>
            <button class="menu-item" data-menu-action="export-svg" role="menuitem">
              <span class="menu-icon">🖼</span><span class="menu-label">SVG (Vektor)</span>
            </button>
            <button class="menu-item" data-menu-action="export-pdf" role="menuitem">
              <span class="menu-icon">📄</span><span class="menu-label">PDF</span>
            </button>
          </div>
        </div>
      </div>

      <input id="file-input-json" type="file" accept="application/json,.json" hidden />
      <input id="file-input-csv" type="file" accept="text/csv,.csv" hidden />

      <!-- Hidden legacy buttons — preserved as event-target stubs so the
           existing bindToolbar() listeners keep working. The dropdown
           menu items dispatch click() to these. `btn-fit` already exists
           in the floating zoom-fab so it isn't duplicated here. -->
      <div hidden>
        <button id="btn-add-root" type="button"></button>
        <button id="btn-expand-all" type="button"></button>
        <button id="btn-collapse-all" type="button"></button>
        <button id="btn-layout-mode" type="button"></button>
        <button id="btn-settings" type="button"></button>
        <button id="btn-stats" type="button"></button>
        <button id="btn-import-json" type="button"></button>
        <button id="btn-export-json" type="button"></button>
        <button id="btn-import-csv" type="button"></button>
        <button id="btn-export-png" type="button"></button>
        <button id="btn-export-svg" type="button"></button>
        <button id="btn-export-pdf" type="button"></button>
      </div>
    </header>

    <!-- Sub-toolbar: filter dropdowns -->
    <section class="filterbar" aria-label="Filter">
      <span class="filterbar-label">Filter</span>
      <label class="filter-field">
        <span class="filter-field-label">Abteilung</span>
        <select id="filter-department" class="filter-select">
          <option value="">Alle Abteilungen</option>
        </select>
      </label>
      <label class="filter-field">
        <span class="filter-field-label">Land</span>
        <select id="filter-country" class="filter-select">
          <option value="">Alle Länder</option>
        </select>
      </label>
      <label class="filter-field" id="filter-root-wrap">
        <span class="filter-field-label">Wurzel</span>
        <select id="filter-root" class="filter-select">
          <option value="">Alle Wurzeln</option>
        </select>
      </label>
      <span id="filter-summary" class="filter-summary" aria-live="polite"></span>
      <button type="button" id="filter-reset" class="btn btn-ghost">Filter zurücksetzen</button>
    </section>

    <main id="chart" class="chart"></main>

    <!-- Floating zoom + fit cluster, bottom-left, Google-Maps-style. -->
    <div class="zoom-fab" role="group" aria-label="Zoom-Steuerung">
      <button id="btn-zoom-in" class="zoom-fab-btn" type="button" title="Vergrößern" aria-label="Vergrößern">+</button>
      <button id="btn-zoom-out" class="zoom-fab-btn" type="button" title="Verkleinern" aria-label="Verkleinern">−</button>
      <button id="btn-fit" class="zoom-fab-btn zoom-fab-fit" type="button" title="An Bildschirm anpassen / zentrieren" aria-label="Zentrieren">⊕</button>
    </div>

    <!-- Stats / KPI sidebar — slides in from the right when the
         toolbar's 📊 button is pressed. -->
    <aside id="stats-sidebar" class="stats-sidebar" hidden aria-label="Statistiken">
      <header class="stats-header">
        <h2>Statistiken</h2>
        <button type="button" id="stats-close" class="stats-close" aria-label="Schließen">×</button>
      </header>
      <div id="stats-body" class="stats-body"></div>
    </aside>

    <!-- Minimap pinned to the bottom-right of the canvas. The canvas
         itself is appended by minimap.js. -->
    <aside id="minimap" class="minimap" aria-label="Übersicht">
      <header class="minimap-header">
        <span>Übersicht</span>
        <button type="button" id="minimap-toggle" class="minimap-toggle" title="Übersicht ein-/ausblenden" aria-label="Übersicht ein-/ausblenden">−</button>
      </header>
    </aside>

    <!-- Floating bar for multi-select bulk operations. Hidden until ≥ 1 selected. -->
    <div id="bulk-bar" class="bulk-bar" hidden role="toolbar" aria-label="Massenbearbeitung">
      <span class="bulk-bar-count" id="bulk-count">0 ausgewählt</span>
      <span class="bulk-bar-divider"></span>
      <label class="bulk-bar-field">
        <span>Abteilung →</span>
        <select id="bulk-department">
          <option value="">–</option>
        </select>
      </label>
      <label class="bulk-bar-field">
        <span>Land →</span>
        <select id="bulk-country">
          <option value="">–</option>
        </select>
      </label>
      <button type="button" id="bulk-delete" class="btn btn-danger">🗑 Löschen</button>
      <button type="button" id="bulk-clear" class="btn btn-ghost">✕ Aufheben</button>
    </div>

    <!-- Modal für Add/Edit -->
    <div id="modal" class="modal" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal-dialog">
        <header class="modal-header">
          <h2 id="modal-title">Knoten bearbeiten</h2>
          <button class="modal-close" data-close aria-label="Schließen">×</button>
        </header>
        <form id="node-form" class="modal-body">
          <input type="hidden" name="id" />
          <input type="hidden" name="parentId" />

          <label>
            <span>Name *</span>
            <input name="name" type="text" required autocomplete="off" />
          </label>
          <label>
            <span>Titel / Position</span>
            <input name="title" type="text" autocomplete="off" />
          </label>
          <label class="field-with-color">
            <span>Abteilung</span>
            <span class="field-input-wrap">
              <input
                name="department"
                type="text"
                list="department-list"
                placeholder="z. B. Technik (oder neue Abteilung anlegen)"
                autocomplete="off"
              />
            </span>
            <div class="color-swatches" role="radiogroup" aria-label="Abteilungs-Farbe">
              <button type="button" class="color-swatch" data-color="#dc2626" style="--swatch:#dc2626" title="Rot" aria-label="Rot"></button>
              <button type="button" class="color-swatch" data-color="#ea580c" style="--swatch:#ea580c" title="Orange" aria-label="Orange"></button>
              <button type="button" class="color-swatch" data-color="#d97706" style="--swatch:#d97706" title="Amber" aria-label="Amber"></button>
              <button type="button" class="color-swatch" data-color="#65a30d" style="--swatch:#65a30d" title="Limette" aria-label="Limette"></button>
              <button type="button" class="color-swatch" data-color="#16a34a" style="--swatch:#16a34a" title="Grün" aria-label="Grün"></button>
              <button type="button" class="color-swatch" data-color="#0d9488" style="--swatch:#0d9488" title="Teal" aria-label="Teal"></button>
              <button type="button" class="color-swatch" data-color="#0891b2" style="--swatch:#0891b2" title="Cyan" aria-label="Cyan"></button>
              <button type="button" class="color-swatch" data-color="#2563eb" style="--swatch:#2563eb" title="Blau" aria-label="Blau"></button>
              <button type="button" class="color-swatch" data-color="#7c3aed" style="--swatch:#7c3aed" title="Violett" aria-label="Violett"></button>
              <button type="button" class="color-swatch" data-color="#db2777" style="--swatch:#db2777" title="Pink" aria-label="Pink"></button>
              <button type="button" class="color-swatch" data-color="#475569" style="--swatch:#475569" title="Schiefer" aria-label="Schiefer"></button>
              <input
                type="color"
                name="departmentColor"
                class="field-color-picker"
                title="Eigene Farbe"
                aria-label="Eigene Farbe"
                value="#9ca3af"
              />
            </div>
          </label>
          <datalist id="department-list"></datalist>
          <label>
            <span>E-Mail</span>
            <input name="email" type="email" autocomplete="off" />
          </label>
          <label>
            <span>Telefon</span>
            <input name="phone" type="tel" placeholder="z. B. +49 89 1234567" autocomplete="off" />
          </label>
          <label class="field-with-image">
            <span>Bild</span>
            <span class="image-field">
              <span class="image-preview" id="image-preview" aria-hidden="true"></span>
              <span class="image-controls">
                <input name="imageUrl" type="url" placeholder="URL oder Datei hochladen…" autocomplete="off" />
                <button type="button" id="image-upload-btn" class="btn btn-icon" title="Bild von Festplatte hochladen" aria-label="Bild hochladen">📁</button>
                <button type="button" id="image-clear-btn" class="btn btn-icon" title="Bild entfernen" aria-label="Bild entfernen" hidden>✕</button>
              </span>
            </span>
            <input id="image-upload-input" type="file" accept="image/jpeg,image/png,image/gif,image/webp,image/svg+xml" hidden />
          </label>
          <label class="field-with-flag">
            <span>Land</span>
            <span class="field-input-wrap">
              <span class="field-flag" id="country-flag-preview" aria-hidden="true"></span>
              <input
                name="country"
                type="text"
                list="country-list"
                placeholder="z. B. Deutschland oder DE"
                autocomplete="off"
              />
              <button
                type="button"
                class="field-clear"
                id="country-clear"
                aria-label="Land entfernen"
                title="Land entfernen"
              >×</button>
            </span>
          </label>
          <datalist id="country-list"></datalist>

          <!-- Slot for dynamically-rendered custom fields. -->
          <div id="custom-fields-slot" class="custom-fields-slot"></div>

          <footer class="modal-footer">
            <button type="button" id="btn-delete" class="btn btn-danger" hidden>Löschen</button>
            <span class="spacer"></span>
            <button type="button" class="btn" data-close>Abbrechen</button>
            <button type="submit" class="btn btn-primary">Speichern</button>
          </footer>
        </form>
      </div>
    </div>

    <!-- Workspaces — chart selection / management -->
    <div id="workspaces-modal" class="modal" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal-dialog modal-dialog--wide">
        <header class="modal-header">
          <h2>Charts verwalten</h2>
          <button class="modal-close" data-close aria-label="Schließen">×</button>
        </header>
        <div class="modal-body">
          <div class="ws-toolbar">
            <input type="search" id="workspaces-search" placeholder="🔍 Suche nach Name oder Tag…" autocomplete="off" />
            <div class="ws-tag-bar">
              <span class="ws-tag-label">Tags:</span>
              <span id="workspaces-tag-filter" class="ws-tag-list"></span>
            </div>
          </div>
          <div id="workspaces-body" class="ws-body"></div>
        </div>
        <footer class="modal-footer">
          <span class="spacer"></span>
          <button type="button" id="workspaces-new" class="btn btn-primary">+ Neuer Chart</button>
          <button type="button" class="btn" data-close>Schließen</button>
        </footer>
      </div>
    </div>

    <!-- Conflict resolution modal (shown on PUT 412) -->
    <div id="conflict-modal" class="modal" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal-dialog">
        <header class="modal-header">
          <h2>⚠ Speicher-Konflikt</h2>
          <button class="modal-close" data-close aria-label="Schließen">×</button>
        </header>
        <div id="conflict-body" class="modal-body"></div>
      </div>
    </div>

    <!-- Custom-Fields Verwaltung -->
    <div id="settings-modal" class="modal" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal-dialog modal-dialog--wide">
        <header class="modal-header">
          <h2>Eigene Felder</h2>
          <button class="modal-close" data-close aria-label="Schließen">×</button>
        </header>
        <div class="modal-body">
          <p class="modal-hint">
            Definiere zusätzliche Felder, die jedem Knoten zur Verfügung stehen.
            Sichtbare Felder werden direkt auf der Karte angezeigt.
          </p>
          <div id="custom-fields-list" class="custom-field-list"></div>
          <form id="custom-field-form" class="custom-field-form" autocomplete="off">
            <input name="key" type="text" placeholder="Schlüssel (z. B. office)" required pattern="[a-zA-Z][a-zA-Z0-9_]*" title="Buchstaben, Ziffern und Unterstrich; muss mit Buchstabe beginnen" />
            <input name="label" type="text" placeholder="Anzeigename (z. B. Büro)" required />
            <select name="type">
              <option value="text">Text</option>
              <option value="number">Zahl</option>
              <option value="date">Datum</option>
              <option value="url">URL</option>
              <option value="email">E-Mail</option>
            </select>
            <label class="custom-field-checkbox">
              <input name="showOnCard" type="checkbox" checked />
              <span>auf Karte anzeigen</span>
            </label>
            <button type="submit" class="btn btn-primary">+ Feld hinzufügen</button>
          </form>
        </div>
        <footer class="modal-footer">
          <span class="spacer"></span>
          <button type="button" class="btn" data-close>Schließen</button>
        </footer>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <!-- Floating popover for the per-card "copy data" action. Positioned
         dynamically next to the clicked button. Esc + outside-click close it. -->
    <div id="card-copy-popover" class="card-copy-popover" role="menu" hidden>
      <button type="button" class="menu-item" data-action="copy-as-text" role="menuitem">
        <span class="menu-icon">📋</span><span class="menu-label">Als Text kopieren</span>
      </button>
      <button type="button" class="menu-item" data-action="copy-as-vcard" role="menuitem">
        <span class="menu-icon">📇</span><span class="menu-label">Als vCard herunterladen</span>
      </button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
